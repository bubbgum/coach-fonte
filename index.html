<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Fonte</title>
<meta name="description" content="Ton coach de musculation : programme, séances guidées, nutrition et progrès.">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Fonte">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Manrope';src:url(fonts/manrope.woff2) format('woff2');font-weight:200 800;font-display:swap}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh}
img{max-width:100%}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
</style>
</head>
<body>
<style>
/* Layout : app mobile une colonne (max 520px), barre d'onglets flottante en verre dépoli, cartes arrondies 22px. Accent bleu cobalt (disque de 20 kg), données colorées par les disques olympiques. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EDF0F5; --surface3:#E3E7EE; --ink:#0C0F16; --ink2:#2A303C; --muted:#687182; --line:rgba(12,15,22,.08);
  --accent:#2F5BFF; --accent2:#1A3DDB; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF; --accent-glow:rgba(47,91,255,.28);
  --red:#E5334B; --yellow:#F0A800; --green:#14A05A; --ok:#14A05A; --ok-soft:#E1F5EA; --warn-soft:#FFF4D4; --warn-ink:#6E5000; --red-soft:#FDE6EA;
  --p25:#E5334B; --p20:#2F5BFF; --p15:#F0B400; --p10:#14A05A; --p5:#E9ECF1; --psm:#8E97A6;
  --glass:rgba(255,255,255,.78); --glass-line:rgba(12,15,22,.08);
  --shadow:0 1px 2px rgba(12,15,22,.04),0 6px 20px rgba(12,15,22,.06);
  --shadow-lg:0 12px 40px rgba(12,15,22,.14);
  --hero1:#2F5BFF; --hero2:#0F1E6B; --hero-ink:#FFFFFF;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:22px; --r-sm:14px; --nav-h:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0C11; --surface:#141821; --surface2:#1B202B; --surface3:#252B38; --ink:#F2F4F8; --ink2:#C9CFDA; --muted:#8B94A5; --line:rgba(255,255,255,.07);
  --accent:#5B7FFF; --accent2:#3F63F2; --accent-ink:#FFFFFF; --accent-soft:rgba(91,127,255,.15); --accent-glow:rgba(91,127,255,.35);
  --red:#FF5068; --yellow:#FFC53D; --green:#35D07F; --ok:#35D07F; --ok-soft:rgba(53,208,127,.14); --warn-soft:rgba(255,197,61,.12); --warn-ink:#FFD36E; --red-soft:rgba(255,80,104,.14);
  --p25:#FF5068; --p20:#5B7FFF; --p15:#FFC53D; --p10:#35D07F; --p5:#DDE2EA; --psm:#7C8597;
  --glass:rgba(20,24,33,.78); --glass-line:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --hero1:#3E63FF; --hero2:#101A4A; --hero-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C11; --surface:#141821; --surface2:#1B202B; --surface3:#252B38; --ink:#F2F4F8; --ink2:#C9CFDA; --muted:#8B94A5; --line:rgba(255,255,255,.07);
  --accent:#5B7FFF; --accent2:#3F63F2; --accent-ink:#FFFFFF; --accent-soft:rgba(91,127,255,.15); --accent-glow:rgba(91,127,255,.35);
  --red:#FF5068; --yellow:#FFC53D; --green:#35D07F; --ok:#35D07F; --ok-soft:rgba(53,208,127,.14); --warn-soft:rgba(255,197,61,.12); --warn-ink:#FFD36E; --red-soft:rgba(255,80,104,.14);
  --p25:#FF5068; --p20:#5B7FFF; --p15:#FFC53D; --p10:#35D07F; --p5:#DDE2EA; --psm:#7C8597;
  --glass:rgba(20,24,33,.78); --glass-line:rgba(255,255,255,.08);
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --hero1:#3E63FF; --hero2:#101A4A; --hero-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button{touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:2rem;line-height:1.04;letter-spacing:-.01em}
h3{font-size:1.06rem;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.h2{font-family:var(--display);font-stretch:108%;font-weight:750;font-size:1.12rem;letter-spacing:-.005em}
.display{font-family:var(--display);font-stretch:105%;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.display small{font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:2px}
.xl{font-size:3.2rem}
.eyebrow{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.84rem} .center{text-align:center;align-self:center}
.lead{font-size:1rem;color:var(--muted);margin:10px 0 0;max-width:34ch}
p{margin:0}
b,strong{font-weight:750}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow);border:0}
fieldset.card{margin:0}
legend.eyebrow{padding:0;float:left;width:100%;margin-bottom:4px}
.pressable,.btn,.day,.next,.alt,.hist,.chk,.tab,.choice span,.seg span{transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .15s,opacity .15s}
.btn:active:not(:disabled),.day:active,.next:active,.alt:active,.hist:active,.chk:active:not(:disabled),.tab:active{transform:scale(.97)}

/* En-têtes */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.top > div:first-child{min-width:0;flex:1}
.top h1{font-size:1.9rem}
.top.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin:-12px -16px 0;padding:10px 16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--glass-line)}
.top.sticky h1{font-size:1.5rem;font-variant-numeric:tabular-nums}
.back{border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;cursor:pointer}
.top.sticky .back{background:var(--surface2);box-shadow:none}
.back svg,.tab svg,.ds svg,.chk svg,.lk,.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top:has(.back){justify-content:flex-start}
.count-chip{flex:none;font-weight:800;font-size:.82rem;padding:8px 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.count-chip span{color:var(--muted);font-weight:600}

/* Boutons */
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:750 .95rem/1 var(--body);padding:13px 18px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;box-shadow:0 6px 18px var(--accent-glow)}
.btn.big{width:100%;min-height:58px;font-size:1.02rem;border-radius:18px}
.btn.sm{min-height:38px;padding:9px 14px;font-size:.85rem;border-radius:12px;box-shadow:none}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--red);color:#fff;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.link:focus-visible,.day:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chk:focus-visible,.next:focus-visible,.alt:focus-visible,.hist:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{appearance:none;background:none;border:0;color:var(--accent);font:700 .9rem var(--body);padding:8px 0;cursor:pointer;text-align:left;min-height:36px}
.link.sm{font-size:.8rem;min-height:0;padding:4px 0}
.danger-t{color:var(--red)}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field span,.lbl{font-size:.78rem;font-weight:700;color:var(--muted)}
input,select,textarea{font:600 16px var(--body);color:var(--ink);background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8;font-weight:500}
textarea{font-size:14px;resize:vertical}
input.err{border-color:var(--red);background:var(--red-soft)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%}
.seg span{display:block;text-align:center;padding:11px 2px;border-radius:11px;font-weight:750;font-size:.92rem;white-space:nowrap}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg input:focus-visible + span{outline:2px solid var(--accent)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;opacity:0}
.choice span{display:flex;flex-direction:column;gap:2px;border:1.5px solid transparent;border-radius:16px;padding:14px 16px 14px 48px;background:var(--surface2);position:relative}
.choice span::before{content:"";position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;border:2px solid var(--muted);opacity:.5;box-sizing:border-box}
.choice small{color:var(--muted);font-size:.84rem;font-weight:500}
.choice input:checked + span{border-color:var(--accent);background:var(--accent-soft)}
.choice input:checked + span::before{border:6px solid var(--accent);opacity:1}
.choice input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
details.more summary,details.how summary{cursor:pointer;font-weight:750;font-size:.9rem;color:var(--accent);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker,details.how summary::-webkit-details-marker{display:none}
details.more summary::before,details.how summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
details[open].more summary::before,details[open].how summary::before{transform:rotate(45deg)}
details.more[open] summary{margin-bottom:10px}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;font-weight:600;background:var(--surface2);padding:12px 14px;border-radius:14px}
.check input{width:22px;height:22px;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;padding:0}

/* Assistant de démarrage */
.hero{padding:22px 0 4px;position:relative}
.hero h1{font-size:2.5rem}
.hero .mark{width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,var(--hero1),var(--hero2));display:grid;place-items:center;color:#fff;margin-bottom:18px;box-shadow:0 10px 30px var(--accent-glow)}
.hero .mark svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero.done h1{color:var(--accent)}
.wiz-top{display:flex;align-items:center;gap:12px}
.wiz-top .bar{flex:1}
.wiz-top span{font-weight:800;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wiz fieldset.card{min-height:0;animation:fadeUp .28s ease}
.wiz-nav{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding-top:6px}
.wiz-nav .btn{flex:1}
.wiz-nav .btn.ghost{flex:0 0 auto;min-width:96px;background:var(--surface);box-shadow:var(--shadow)}
.q{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:1.45rem;line-height:1.15;margin:2px 0 4px}
@keyframes fadeUp{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Accueil */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);position:relative}
.wd small{font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.wd b{font-family:var(--display);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;line-height:1}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wd.plan i{background:var(--accent)}
.wd.done{background:var(--accent);box-shadow:0 6px 16px var(--accent-glow)}
.wd.done small,.wd.done b{color:#fff}
.wd.done i{background:#fff}
.wd.today{outline:2px solid var(--accent);outline-offset:-2px}
.wd.done.today{outline-color:transparent}
.next{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;cursor:pointer;font:inherit;border:0;background:linear-gradient(150deg,var(--hero1) 0%,var(--hero2) 100%);color:var(--hero-ink);padding:22px;position:relative;overflow:hidden;border-radius:26px;box-shadow:0 18px 40px var(--accent-glow)}
.next .eyebrow{color:rgba(255,255,255,.72)}
.next .display{font-size:2.3rem;font-stretch:112%;letter-spacing:-.02em;line-height:1}
.next .meta{font-size:.88rem;font-weight:600;opacity:.85;display:flex;gap:14px}
.next .meta span{display:inline-flex;align-items:center;gap:5px}
.next .meta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.next .btn{margin-top:4px;background:#fff;color:#0C0F16;box-shadow:0 6px 18px rgba(0,0,0,.2);width:100%}
.next::before,.next::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.next::after{right:-70px;top:-70px;width:190px;height:190px;border:22px solid rgba(255,255,255,.13)}
.next::before{right:-18px;top:-18px;width:86px;height:86px;border:12px solid rgba(255,255,255,.1)}
.next > *{position:relative;z-index:1}
.next .tags i{background:rgba(255,255,255,.16);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags i{font-style:normal;font-size:.76rem;font-weight:750;padding:5px 10px;border-radius:99px;background:var(--surface2)}
.tags.big i{font-size:.85rem;padding:6px 12px;background:var(--accent-soft);color:var(--accent)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 2px 0}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.day{width:100%;display:grid;grid-template-columns:50px 1fr 24px;align-items:center;gap:14px;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:20px;padding:12px 14px 12px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.dn{font-family:var(--display);font-stretch:110%;font-weight:800;font-size:1.15rem;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.dt{display:flex;flex-direction:column;min-width:0;gap:1px}
.dt b{font-size:1rem}
.dt small{color:var(--muted);font-size:.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds{color:var(--muted);display:grid;place-items:center}
.day.cur{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.day.cur .dn{background:var(--accent);color:#fff}
.day.cur .ds{color:var(--accent)}
.day.done .dn{background:var(--ok-soft);color:var(--ok)}
.day.done .ds{color:var(--ok)}
.day.lock .dt,.day.lock .dn{opacity:.55}
.stat{display:flex;flex-direction:column;gap:8px;padding:16px}
.stat .display{font-size:1.9rem}
.stat small{color:var(--muted);font-size:.78rem;font-weight:500;line-height:1.35}
.stat .eyebrow{font-size:.64rem}
.icon-dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.icon-dot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-dot.o{background:var(--warn-soft);color:var(--yellow)} .icon-dot.g{background:var(--ok-soft);color:var(--ok)} .icon-dot.r{background:var(--red-soft);color:var(--red)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.tips li{position:relative;padding-left:22px;font-size:.93rem;color:var(--ink2)}
.tips li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.tips b{color:var(--ink)}
.note{border-radius:18px;padding:14px 16px;font-size:.92rem;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.warn .btn.ghost{color:var(--warn-ink);background:transparent;border:1.5px solid currentColor}

/* Aperçu du jour */
.preview{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pv{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:10px 14px 10px 10px;align-items:center}
.pv-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.pv-body b{font-size:.98rem;line-height:1.25}
.target{font-weight:750;font-size:.84rem;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--accent)}
.sticky-cta{position:sticky;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));padding-top:18px;margin-top:-6px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);z-index:4}

/* Images d'exercice : sprite deux images côte à côte */
.ex-img{position:relative;overflow:hidden;border-radius:14px;background:#fff;width:100%;max-width:100%;display:block}
.ex-img img{position:absolute;top:0;left:0;display:block;width:200%;max-width:none;height:100%;object-fit:cover}
.ex-img .f1{transform:translateX(-50%);opacity:0;animation:move 3s ease-in-out infinite;will-change:opacity}
.ex-img.big{border-radius:18px}
.ex-img[data-a]{cursor:zoom-in}
.ex-img.noimg{aspect-ratio:3/2;background:var(--surface2)}
@keyframes move{0%,22%{opacity:0}38%,62%{opacity:1}78%,100%{opacity:0}}
.zoom-ic{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:10px;background:rgba(12,15,22,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.zoom-ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pv .zoom-ic{width:24px;height:24px;border-radius:8px;right:6px;top:6px}
.pv .zoom-ic svg{width:12px;height:12px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.95rem;color:var(--ink2)}

// Temps de récupération (constante en heures) : les gros muscles récupèrent plus lentement
const TAU = { pecs: 30, dos: 30, lombaires: 34, quadri: 32, ischios: 32, fessiers: 30, epaules_ant: 22, epaules_lat: 20, epaules_post: 20, biceps: 20, triceps: 20, mollets: 18, abdos: 16 };
const SORENESS = { legere: { label: 'légères', malus: 10 }, moyenne: { label: 'moyennes', malus: 25 }, forte: { label: 'fortes', malus: 45 } };

function coachState() {
  if (!S.coach) S.coach = {};
  const c = S.coach;
  c.memory = c.memory || { likes: [], dislikes: [], avoid: [], equipment: [], notes: [] };
  c.condition = c.condition || { soreness: {}, pain: {}, energy: null, minutes: null, date: null };
  c.server = c.server || { url: '', code: '' };
  return c;
}
function isToday(t) { return t && new Date(t).toDateString() === new Date().toDateString(); }

// Charge accumulée par muscle sur 8 jours, avec décroissance exponentielle
function muscleLoad(now) {
  const load = {}, last = {};
  S.sessions.filter(s => now - s.date < 8 * 864e5).forEach(s => s.items.forEach(it => {
    const m = MMAP[it.ex] || {}; if (!it.sets || !it.sets.length) return;
    const eff = it.sets.reduce((t, x) => t + (x.rpe ? Math.min(1.1, Math.max(.5, (x.rpe - 3) / 6)) : .85), 0);
    const h = (now - s.date) / 36e5;
    Object.entries(m).forEach(([k, w]) => {
      if (w < .3) return;
      load[k] = (load[k] || 0) + eff * w * Math.exp(-h / TAU[k]);
      if (!last[k] || s.date > last[k]) last[k] = s.date;
    });
  }));
  return { load, last };
}
function muscleRecovery() {
  const now = Date.now(), c = coachState().condition, { load, last } = muscleLoad(now);
  const painMuscles = {};
  Object.entries(c.pain || {}).forEach(([area, p]) => (PAIN_AREAS[area] ? PAIN_AREAS[area].muscles : []).forEach(m => { painMuscles[m] = PAIN_AREAS[area].label + (p.note ? ' (' + p.note + ')' : ''); }));
  return Object.keys(MUSCLES).map(k => {
    let rec = 100 - Math.min(100, (load[k] || 0) / 8 * 100);
    const so = c.soreness && c.soreness[k];
    const soValid = so && now - so.at < 72 * 36e5;
    if (soValid) rec -= SORENESS[so.level].malus * (1 - (now - so.at) / (72 * 36e5 * 1.5));
    rec = Math.max(0, Math.min(100, Math.round(rec)));
    return { id: k, label: MUSCLES[k], rec, lastH: last[k] ? Math.round((now - last[k]) / 36e5) : null, soreness: soValid ? so.level : null, pain: painMuscles[k] || null };
  });
}
function recoveryMap() { const o = {}; muscleRecovery().forEach(m => { o[m.id] = m; }); return o; }
function blockedByPain(key, rmap) { const m = MMAP[key] || {}; return Object.entries(m).some(([k, w]) => w >= .5 && rmap[k] && rmap[k].pain); }
function tooFatigued(key, rmap, threshold) { const m = MMAP[key] || {}; return Object.entries(m).some(([k, w]) => w >= .5 && rmap[k] && rmap[k].rec < threshold); }
function avoidedByUser(key) { const mem = coachState().memory; return (mem.avoid || []).includes(key) || (mem.dislikes || []).includes(key); }

function roleFor(key, idx) {
  const m = MMAP[key] || {}; const ex = LIB[key];
  if ((m.abdos || 0) >= .8 || ex.unit === 's') return 'core';
  const sum = Object.values(m).reduce((a, b) => a + b, 0);
  if (sum >= 1.5) return idx === 0 ? 'main' : 'sec';
  return 'iso';
}
function schemeFor(key, role, minutes, energy) {
  const p = S.profile; let [sets, lo, hi, rest] = SCHEMES[p.goal][role];
  if (p.level === 'debutant') { if (role === 'main') sets = Math.min(sets, 3); if (role === 'iso') sets = 2; }
  if (minutes && minutes <= 35) { sets = Math.max(2, sets - 1); rest = Math.round(rest * .75 / 15) * 15; }
  if (energy === 'faible') sets = Math.max(2, sets - 1);
  if (energy === 'haute' && role === 'main') sets += 1;
  if (LIB[key].unit === 's') { lo = 30; hi = 60; }
  return { sets, lo, hi, rest };
}
function countForMinutes(min) { return min <= 25 ? 3 : min <= 35 ? 4 : min <= 50 ? 5 : min <= 65 ? 6 : 7; }
// Propose une séance adaptée à la récupération, aux douleurs, au temps et à l'énergie
function draftWorkout(opts) {
  opts = opts || {};
  const c = coachState().condition;
  const minutes = Math.max(15, Math.min(120, +opts.minutes || c.minutes || S.profile.duration || 60));
  const energy = opts.energy || c.energy || 'normale';
  const rmap = recoveryMap();
  expandMuscles(opts.avoid_muscles).forEach(m => { if (rmap[m]) rmap[m] = Object.assign({}, rmap[m], { rec: 0 }); });
  let tplKey = opts.focus && TEMPLATES[opts.focus] ? opts.focus : null;
  const scored = Object.entries(TEMPLATES).map(([k, t]) => {
    const recs = t.focus.map(m => rmap[m]);
    const avg = recs.reduce((a, m) => a + m.rec, 0) / recs.length;

/* ===== Calculs du coach ===== */
function bodyWeight() { const w = S.weights.length ? S.weights[S.weights.length-1].kg : null; return w || (S.profile && S.profile.weight) || 70; }
function calc() {
  const p = S.profile; const w = bodyWeight(); const h = p.height; const hm = h / 100;
  const bmr = 10*w + 6.25*h - 5*p.age + (p.sex === 'f' ? -161 : 5);
  const base = {sedentaire:1.2, debout:1.35, physique:1.5}[p.activity] || 1.2;
  const factor = base + 0.025 * p.days;

  const kcal = Math.round((tdee * goalMul + (S.kcalAdj || 0)) / 10) * 10;

    else if (p.sex !== 'f') bf = 495 / (1.0324 - 0.19077*Math.log10(waist - neck) + 0.15456*Math.log10(h)) - 450;
    if (bf != null && (bf < 3 || bf > 60)) bf = null;

  return { w, bmr:Math.round(bmr), tdee:Math.round(tdee), kcal, prot, fat, carbs, water, bmi:r1(bmi), rate, bf: bf != null ? r1(bf) : null, ffmi: ffmi ? r1(ffmi) : null, steps, fiber: Math.round(kcal/1000*14) };
}

}

/* ===== Programme ===== */

let audioCtx = null, restTick = null;

/* --- Graphique --- */
function lineChart(pts, opt) {
  opt = opt || {};
  if (pts.length < 2) return `<div class="chart-empty">${opt.empty || 'Il faut au moins 2 mesures pour tracer la courbe.'}</div>`;
  const W = 340, H = 150, L = 34, R = 10, T = 12, B = 22;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y).concat(opt.extra || []);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.15 || 1; y0 -= pad; y1 += pad;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const path = arr => arr.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const ticks = [y0 + pad, (y0 + y1) / 2, y1 - pad];
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Graphique')}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" class="ax">${fmtKg(r1(t))}</text>`).join('')}
    <text x="${L}" y="${H-5}" class="ax">${fmtDate(x0, {day:'numeric', month:'short'})}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="ax">${fmtDate(x1, {day:'numeric', month:'short'})}</text>
    <path d="${path(pts)} L${X(last.x)} ${H-B} L${X(pts[0].x)} ${H-B} Z" class="area"/>
    ${opt.raw ? opt.raw.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2" class="dot-raw"/>`).join('') : ''}
    <path d="${path(pts)}" class="ln"/>
    <circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4" class="dot"/>
  </svg>`;
}

    ${lineChart(avg, { raw: wpts, label: 'Poids de corps, moyenne sur 7 jours', empty: 'Pèse-toi 2 jours de suite pour voir ta courbe. Je trace la moyenne sur 7 jours pour lisser les variations d\'eau.' })}
    <form class="row" data-f="weigh"><input id="w-prog" type="number" step="0.1" inputmode="decimal" placeholder="Poids (kg)" required><button class="btn" type="submit">Ajouter</button></form>

/* ===== Outils du Coach IA =====
   Toutes les fonctions s'exécutent sur le téléphone, sur les données locales.
   Le modèle ne reçoit que leurs résultats, sous forme de résumés compacts. */
const EX_KEYS = Object.keys(LIB);
const MUSCLE_ENUM = Object.keys(MUSCLES).concat(Object.keys(MUSCLE_GROUPS));
const EQ_LABEL = { bar: 'barre', db: 'haltères', machine: 'machine', cable: 'poulie', bw: 'poids du corps' };
const ago = t => { const h = (Date.now() - t) / 36e5; return h < 1 ? "il y a moins d'1 h" : h < 36 ? 'il y a ' + Math.round(h) + ' h' : 'il y a ' + Math.round(h / 24) + ' j'; };
const setStr = (s, ex) => (ex && ex.eq === 'bw' && !s.w ? '' : fmtKg(s.w) + 'kg×') + s.r + (ex && ex.unit === 's' ? 's' : '') + (s.rpe ? '@' + s.rpe : '');
const exName = k => (LIB[k] ? LIB[k].name : k);
const normTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function resolveKey(k) {
  if (!k) return k; if (LIB[k]) return k;
  const n = normTxt(k); if (!n) return k;
  const hit = EX_KEYS.find(x => normTxt(LIB[x].name) === n) || EX_KEYS.find(x => normTxt(LIB[x].name).includes(n)) || EX_KEYS.find(x => n.includes(normTxt(LIB[x].name)));
  return hit || k;
}

function getContextSummary() {
  const p = S.profile, last = S.sessions[S.sessions.length - 1];
  const rec = muscleRecovery();
  const recovering = rec.filter(m => m.rec < 85 || m.pain || m.soreness).map(m => `${m.label} ${m.pain ? 'DOULEUR (' + m.pain + ')' : m.rec + '%'}${m.soreness ? ', courbatures ' + SORENESS[m.soreness].label : ''}`);
  const fresh = rec.filter(m => m.rec >= 85 && !m.pain && !m.soreness).map(m => m.label);
  const avgDur = S.sessions.length ? Math.round(S.sessions.slice(-8).reduce((a, s) => a + (s.dur || 0), 0) / Math.min(8, S.sessions.length)) : null;
  const mem = coachState().memory, c = coachState().condition;
  const lines = [
    `Date : ${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}, ${new Date().getHours()} h.`,
    `Profil : ${p.sex === 'f' ? 'femme' : 'homme'}, ${p.age} ans, ${p.height} cm, ${fmtKg(bodyWeight())} kg, objectif ${GOALS[p.goal][0].toLowerCase()}, niveau ${LEVELS[p.level][0].toLowerCase()}, ${p.days} séances/semaine, ${p.duration} min habituelles.`,
    `Programme : ${plan().name}, semaine ${S.cycle.week}${isDeload() ? ' (décharge)' : ''}. Prochain jour prévu : Jour ${nextDay() + 1} « ${dayDef(nextDay()).name} ».`,
    last ? `Dernière séance : ${last.dayName} (${[...new Set(last.items.flatMap(it => Object.keys(MMAP[it.ex] || {}).filter(k => MMAP[it.ex][k] >= 1)).map(k => MUSCLES[k]))].join(', ')}), ${ago(last.date)}, ${last.dur} min.` : 'Aucune séance enregistrée pour l\'instant.',
    `${S.sessions.length} séances au total${avgDur ? ', durée moyenne ' + avgDur + ' min' : ''}.`,
    `En récupération : ${recovering.length ? recovering.join(' ; ') : 'rien'}.`,
    `Disponibles : ${fresh.length ? fresh.join(', ') : 'aucun muscle totalement frais'}.`,
    isToday(c.date) && c.energy ? `Énergie déclarée aujourd'hui : ${c.energy}.` : '',
    isToday(c.date) && c.minutes ? `Temps disponible déclaré : ${c.minutes} min.` : '',
    S.active ? `SÉANCE EN COURS : « ${activeTitle()} », ${S.active.items.filter(i => i.rows.every(r => r.done)).length}/${S.active.items.length} exercices faits. Utilise getCurrentWorkout pour le détail.` : 'Pas de séance en cours.',
    mem.likes.length ? `Aime : ${mem.likes.map(exName).join(', ')}.` : '',
    (mem.dislikes.length || mem.avoid.length) ? `À éviter : ${mem.dislikes.concat(mem.avoid).map(exName).join(', ')}.` : '',
    mem.equipment.length ? `Matériel indisponible dans sa salle : ${mem.equipment.join(', ')}.` : '',
    mem.notes.length ? `Notes : ${mem.notes.join(' ; ')}.` : '',
  ];
  return lines.filter(Boolean).join('\n');
}

const COACH_INSTRUCTIONS = `Tu es « Coach », le coach de musculation personnel de l'application Coach Fonte. Tu parles français, tu tutoies, comme un coach de salle : encourageant, clair, direct, motivant sans en faire trop. Tes phrases sont LUES À VOIX HAUTE : 1 à 3 phrases courtes, pas de listes, pas d'emoji, pas de markdown. Dis « soixante kilos » plutôt que « 60kg ».

FORMAT DE RÉPONSE OBLIGATOIRE : un seul objet JSON, rien d'autre :
{"say":"ce que tu dis à voix haute","actions":[{"tool":"nomOutil","args":{...}}]}
- "actions" peut être vide. Les outils s'exécutent sur le téléphone de l'utilisateur.
- Si tu as besoin d'informations (outils de lecture), mets "say":"" et demande les outils : tu recevras leurs résultats, puis tu répondras.
- N'invente jamais de chiffres ni d'identifiants d'exercice : utilise ceux renvoyés par les outils.

OUTILS
Lecture : getMuscleRecovery{} ; getRecentWorkouts{count} ; getExerciseHistory{exercise_key} ; getUserPreferences{} ; getCurrentWorkout{} ; findAlternatives{exercise_key | muscle} ; draftWorkout{minutes, focus?(jambes|push|pull|haut|full|bras), avoid_muscles?[], energy?(faible|normale|haute)}
Écriture : adaptCurrentWorkout{} (retire ou remplace dans la séance en cours les exercices qui sollicitent une zone douloureuse) ; reportCondition{soreness?[{muscle, level(legere|moyenne|forte|aucune)}], energy?, available_minutes?, pain?[{area(epaule|coude|poignet|genou|bas_du_dos|hanche|nuque|cheville|pectoraux|dos|cuisse), note?}], pain_resolved?[area]} ; rememberPreference{kind(like|dislike|avoid|equipment_missing|note), exercise_key?, value?, remove?} ; createWorkout{name, muscles[], advice?, replace_current?, exercises[{exercise_key, sets?, reps_min?, reps_max?, rest_seconds?, weight_kg?, note?}]} ; startProgramDay{} ; updateWorkout{action(replace|add|remove|set_params|set_weight), exercise_index?, new_exercise_key?, sets?, reps_min?, reps_max?, rest_seconds?, weight_kg?, weight_delta_kg?} ; logSet{exercise_index?, weight_kg?, reps?, rpe?, correct_last?} ; finishWorkout{}
Muscles : pecs, dos, lombaires, epaules_ant, epaules_lat, epaules_post, epaules, biceps, triceps, bras, quadri, ischios, fessiers, mollets, jambes, abdos.

RÈGLES
- Courbatures, fatigue, énergie, temps disponible, douleur : enregistre-les avec reportCondition. Préférences durables : rememberPreference.
- Choisir une séance : raisonne sur la récupération de chaque muscle, muscles secondaires compris (développé couché → triceps et épaules avant ; rowing → biceps). Évite les muscles sous 55 % ou avec courbatures moyennes ou fortes. Utilise draftWorkout pour construire une base, puis PROPOSE-la en une ou deux phrases (focus, nombre d'exercices, durée, pourquoi).
- Ne lance createWorkout qu'après accord (« vas-y », « ok », « go ») : reprends alors les exercices du brouillon.
- Temps : 20 min = 3 exercices, 45 min = 5, 75 min = 7 ; le temps disponible se passe à draftWorkout.
- DOULEUR ≠ COURBATURE : une douleur articulaire, vive ou inhabituelle, on ne travaille PAS la zone. Enregistre-la, retire ou remplace les exercices concernés, conseille de ne pas insister ; si elle est forte ou persiste, de consulter un professionnel de santé. Tu n'es pas médecin, aucun diagnostic.
- Pendant la séance : « 12 reps à 60 kilos, difficulté 7 » → logSet puis une phrase de consigne. « Machine prise » → findAlternatives puis updateWorkout replace. « 5 kilos de plus » → updateWorkout set_weight weight_delta_kg 5. « 12 au lieu de 10 » → logSet correct_last. « Trop lourd » → propose −5 à −10 %. Série facile (RPE ≤ 6) en haut de fourchette → légère hausse possible, jamais systématique. « J'ai fini » → finishWorkout.
- Progression raisonnable : +2,5 kg haut du corps, +5 kg bas du corps seulement si le haut de la fourchette est atteint avec une difficulté modérée.`;

const TOOL_LABELS = { getContextSummary: 'Lecture du résumé', getRecentWorkouts: 'Dernières séances consultées', getMuscleRecovery: 'Récupération analysée', getExerciseHistory: 'Progression consultée',
  getUserPreferences: 'Préférences consultées', reportCondition: 'État du jour noté', rememberPreference: 'Préférence mémorisée', findAlternatives: 'Alternatives cherchées', draftWorkout: 'Séance préparée',
  createWorkout: 'Séance créée', startProgramDay: 'Séance du programme lancée', getCurrentWorkout: 'Séance en cours lue', adaptCurrentWorkout: 'Séance adaptée à la douleur', updateWorkout: 'Séance modifiée', logSet: 'Série enregistrée', finishWorkout: 'Séance enregistrée' };

function itemIndex(args) {
  const A = S.active; if (!A) throw new Error("Aucune séance en cours. Crée ou lance d'abord une séance.");
  let k = args.exercise_index ? args.exercise_index - 1 : A.cur;
  if (k >= A.items.length) k = A.items.length - 1;
  if (k < 0 || !A.items[k]) throw new Error('Exercice introuvable dans la séance.');
  return k;
}
function currentWorkoutSummary() {
  const A = S.active; if (!A) return { active: false };
  return { active: true, name: activeTitle(), warmup_done: A.warm, current_index: Math.min(A.cur, A.items.length - 1) + 1,
    exercises: A.items.map((it, k) => ({ index: k + 1, key: it.ex, name: exName(it.ex), target: `${it.sets}×${it.lo}-${it.hi}${LIB[it.ex].unit === 's' ? 's' : ''}, repos ${it.rest}s`,
      weight_planned: num((it.rows.find(r => !r.done) || it.rows[it.rows.length - 1] || {}).w), done: it.rows.filter(r => r.done).map(r => setStr({ w: num(r.w) || 0, r: num(r.r) || 0, rpe: r.rpe }, LIB[it.ex])).join(', ') || 'aucune' })) };
}

const TOOL_IMPL = {
  getContextSummary: () => getContextSummary(),
  getRecentWorkouts: ({ count }) => S.sessions.slice(-(count || 3)).reverse().map(s => ({
    date: new Date(s.date).toLocaleDateString('fr-FR'), quand: ago(s.date), nom: s.dayName, duree_min: s.dur,
    exercices: s.items.filter(it => it.sets.length).map(it => `${exName(it.ex)} : ${it.sets.map(x => setStr(x, LIB[it.ex])).join(', ')}`) })),
  getMuscleRecovery: () => muscleRecovery().map(m => `${m.label} : ${m.pain ? 'DOULEUR ' + m.pain : m.rec + '%'}${m.lastH != null ? ', sollicité ' + (m.lastH < 36 ? 'il y a ' + m.lastH + ' h' : 'il y a ' + Math.round(m.lastH / 24) + ' j') : ', pas sollicité depuis 8 j'}${m.soreness ? ', courbatures ' + SORENESS[m.soreness].label : ''}`).join('\n'),
  getExerciseHistory: ({ exercise_key }) => {
    const rows = []; let best = 0;
    S.sessions.forEach(s => s.items.forEach(it => { if (it.ex === exercise_key && it.sets.length) { rows.push(`${new Date(s.date).toLocaleDateString('fr-FR')} : ${it.sets.map(x => setStr(x, LIB[it.ex])).join(', ')}`); it.sets.forEach(x => { best = Math.max(best, e1rm(x.w, x.r)); }); } }));
    if (!rows.length) return `Jamais fait ${exName(exercise_key)}. Charge de départ conseillée par Coach : ${suggest({ ex: exercise_key, role: 'sec', sets: 3, lo: 8, hi: 12 }).w || 'à trouver'} kg.`;
    return { exercice: exName(exercise_key), dernieres_seances: rows.slice(-6), meilleur_1RM_estime_kg: r1(best) };
  },
  getUserPreferences: () => { const p = S.profile, m = coachState().memory; return { objectif: GOALS[p.goal][0], niveau: LEVELS[p.level][0], frequence: p.days + ' séances/semaine', duree_preferee: p.duration + ' min', programme: plan().name,
    aime: m.likes.map(exName), n_aime_pas: m.dislikes.map(exName), a_eviter: m.avoid.map(exName), materiel_indisponible: m.equipment, notes: m.notes }; },
  reportCondition: (a) => {
    const c = coachState().condition; if (!isToday(c.date)) { c.energy = null; c.minutes = null; } c.date = Date.now();
    (a.soreness || []).forEach(s => expandMuscles([s.muscle]).forEach(m => { if (s.level === 'aucune') delete c.soreness[m]; else c.soreness[m] = { level: s.level, at: Date.now() }; }));
    if (a.energy) c.energy = a.energy;
    if (a.available_minutes) c.minutes = a.available_minutes;
    (a.pain || []).forEach(p => { c.pain[p.area] = { note: p.note || '', at: Date.now() }; });
    (a.pain_resolved || []).forEach(k => { delete c.pain[k]; });
    persist(); if (view.name === 'home') render();
    return 'Noté. ' + TOOL_IMPL.getMuscleRecovery();
  },
  rememberPreference: ({ kind, exercise_key, value, remove }) => {
    const m = coachState().memory; const list = { like: 'likes', dislike: 'dislikes', avoid: 'avoid', equipment_missing: 'equipment', note: 'notes' }[kind];
    const v = ['like', 'dislike', 'avoid'].includes(kind) ? exercise_key : (value || '').trim();
    if (!v) throw new Error(['like', 'dislike', 'avoid'].includes(kind) ? 'exercise_key manquant' : 'value manquant');
    m[list] = m[list].filter(x => x !== v); if (!remove) m[list].push(v);
    if (m.notes.length > 15) m.notes = m.notes.slice(-15);
    persist(); return remove ? 'Oublié.' : 'Mémorisé.';
  },
  findAlternatives: ({ exercise_key, muscle }) => {
    const rmap = recoveryMap(); let cands;
    if (exercise_key) { const main = Object.entries(MMAP[exercise_key] || {}).filter(([, w]) => w >= 1).map(([k]) => k);
      cands = [...new Set((LIB[exercise_key].alts || []).concat(EX_KEYS.filter(k => k !== exercise_key && main.some(m => (MMAP[k] || {})[m] >= 1))))]; }
    else { const ms = expandMuscles([muscle]); cands = EX_KEYS.filter(k => ms.some(m => (MMAP[k] || {})[m] >= 1)); }
    return cands.filter(k => !blockedByPain(k, rmap) && !avoidedByUser(k) && k !== exercise_key).slice(0, 8).map(k => `${k} : ${LIB[k].name} (${EQ_LABEL[LIB[k].eq]})`).join('\n') || 'Aucune alternative compatible.';
  },
  draftWorkout: (a) => { const d = draftWorkout(a); return { nom: d.name, duree_estimee_min: d.minutes, raison: d.reason,
    exercices: d.exercises.map(e => ({ exercise_key: e.key, nom: exName(e.key), sets: e.sets, reps_min: e.lo, reps_max: e.hi, rest_seconds: e.rest })) }; },
  createWorkout: (a) => {
    if (S.active && S.active.items.some(it => it.rows.some(r => r.done)) && !a.replace_current) throw new Error('Une séance est déjà commencée. Demande confirmation puis rappelle createWorkout avec replace_current=true, ou utilise updateWorkout.');
    const exercises = (a.exercises || []).filter(e => LIB[e.exercise_key]).map(e => ({ key: e.exercise_key, sets: e.sets, lo: e.reps_min, hi: e.reps_max, rest: e.rest_seconds, weight: e.weight_kg, note: e.note }));
    if (!exercises.length) throw new Error('Aucun exercice valide.');
    const blocked = exercises.filter(e => blockedByPain(e.key, recoveryMap())).map(e => exName(e.key));
    if (blocked.length) throw new Error('Refusé : ces exercices sollicitent une zone douloureuse : ' + blocked.join(', ') + '. Remplace-les.');
    startCustomSession({ name: a.name, focus: expandMuscles(a.muscles), advice: a.advice, exercises }, 'ia');
    return { ok: true, message: 'Séance lancée et affichée.', seance: currentWorkoutSummary() };
  },
  startProgramDay: () => {
    if (S.active && S.active.items.some(it => it.rows.some(r => r.done))) throw new Error('Une séance est déjà en cours.');
    startSession(nextDay()); return { ok: true, seance: currentWorkoutSummary() };
  },
  getCurrentWorkout: () => currentWorkoutSummary(),
  updateWorkout: (a) => {
    const A = S.active; if (!A) throw new Error('Aucune séance en cours.');
    if (a.action === 'add') {
      if (!a.new_exercise_key) throw new Error('new_exercise_key manquant');
      if (blockedByPain(a.new_exercise_key, recoveryMap())) throw new Error('Cet exercice sollicite une zone douloureuse.');
      const it = buildItem({ key: a.new_exercise_key, sets: a.sets, lo: a.reps_min, hi: a.reps_max, rest: a.rest_seconds, weight: a.weight_kg }, A.items.length);
      const pos = a.exercise_index ? Math.max(A.cur + 1, Math.min(A.items.length, a.exercise_index - 1)) : A.items.length;
      A.items.splice(pos, 0, it);
    } else {
      const k = itemIndex(a), it = A.items[k];
      if (a.action === 'remove') {
        if (it.rows.some(r => r.done)) { it.rows = it.rows.filter(r => r.done); it.sets = it.rows.length; }
        else A.items.splice(k, 1);
        if (!A.items.length) throw new Error('La séance ne peut pas être vide.');
        const nx = A.items.findIndex(x => !x.rows.every(r => r.done)); A.cur = nx < 0 ? A.items.length : nx;
      } else if (a.action === 'replace') {
        if (!a.new_exercise_key) throw new Error('new_exercise_key manquant');
        if (blockedByPain(a.new_exercise_key, recoveryMap())) throw new Error('Cet exercice sollicite une zone douloureuse.');
        const fresh = buildItem({ key: a.new_exercise_key, role: it.role, sets: a.sets || it.sets, lo: a.reps_min || it.lo, hi: a.reps_max || it.hi, rest: a.rest_seconds || it.rest, weight: a.weight_kg }, k);
        const done = it.rows.filter(r => r.done);
        if (done.length) { it.rows = done; it.sets = done.length; A.items.splice(k + 1, 0, fresh); }
        else { fresh.si = it.si; A.items[k] = fresh; }
      } else if (a.action === 'set_params') {
        if (a.reps_min) it.lo = a.reps_min; if (a.reps_max) it.hi = Math.max(a.reps_max, it.lo); if (a.rest_seconds) it.rest = a.rest_seconds;
        if (a.sets) { const done = it.rows.filter(r => r.done).length; const target = Math.max(done, a.sets); while (it.rows.length < target) it.rows.push({ w: it.rows[it.rows.length - 1] ? it.rows[it.rows.length - 1].w : '', r: '', done: false, rpe: null }); while (it.rows.length > target && !it.rows[it.rows.length - 1].done) it.rows.pop(); it.sets = it.rows.length; }
      } else if (a.action === 'set_weight') {
        it.rows.forEach(r => { if (r.done) return; const cur = num(r.w) || 0; const nw = a.weight_kg != null ? a.weight_kg : Math.max(0, cur + (a.weight_delta_kg || 0)); r.w = String(r1(nw)).replace('.', ','); });
      }
    }
    persist(); render(); return currentWorkoutSummary();
  },
  logSet: (a) => {
    const A = S.active; if (!A) throw new Error('Aucune séance en cours.');
    A.warm = true;
    const k = itemIndex(a), it = A.items[k], ex = LIB[it.ex];
    let row;
    if (a.correct_last) { row = [...it.rows].reverse().find(r => r.done); if (!row) throw new Error('Aucune série à corriger sur cet exercice.'); }
    else { row = it.rows.find(r => !r.done); if (!row) { it.rows.push({ w: it.rows[it.rows.length - 1].w, r: '', done: false, rpe: null }); it.sets = it.rows.length; row = it.rows[it.rows.length - 1]; } }
    if (a.weight_kg != null) row.w = String(a.weight_kg).replace('.', ',');
    if (a.reps != null) row.r = String(a.reps);
    if (a.rpe != null) row.rpe = Math.round(a.rpe * 2) / 2;
    if (!a.correct_last) {
      if (!num(row.r)) throw new Error('Nombre de répétitions manquant.');
      row.done = true;
      it.rows.forEach(r => { if (!r.done && a.weight_kg != null) r.w = row.w; });
      const all = it.rows.every(r => r.done);
      if (all) { const nx = A.items.findIndex(x => !x.rows.every(r => r.done)); A.cur = nx < 0 ? A.items.length : nx; view.scroll = true; }
      if (A.items.some(x => x.rows.some(r => !r.done))) startRest(it.rest); else A.restEnd = null;
    }
    persist(); if (view.name === 'session') render();
    const w = num(row.w) || 0, reps = num(row.r) || 0;
    const remaining = it.rows.filter(r => !r.done).length;
    let hint = 'Garde la même charge.';
    if (row.rpe >= 9.5 || reps < it.lo) hint = `Trop dur : propose ${fmtKg(roundTo(w * .92, ex.eq === 'db' ? 2 : 2.5))} kg pour la suite.`;
    else if (reps >= it.hi && row.rpe && row.rpe <= 7) hint = 'Facile et haut de fourchette atteint : légère hausse possible la prochaine fois.';
    const next = A.items[A.cur];
    return { enregistre: `${exName(it.ex)} ${setStr({ w, r: reps, rpe: row.rpe }, ex)}`, series_restantes_sur_cet_exercice: remaining, cible: `${it.lo}-${it.hi}`, repos_s: it.rest, conseil: hint,
      exercice_suivant: remaining ? null : (next ? `${exName(next.ex)} (${next.sets}×${next.lo}-${next.hi})` : 'Tous les exercices sont faits : propose de terminer.') };
  },
  adaptCurrentWorkout: () => {
    const A = S.active; if (!A) return { changes: [] };
    const rmap = recoveryMap(), changes = [];
    for (let k = A.items.length - 1; k >= 0; k--) {
      const it = A.items[k]; if (it.rows.every(r => r.done) || !blockedByPain(it.ex, rmap)) continue;
      const alt = String(TOOL_IMPL.findAlternatives({ exercise_key: it.ex })).split('\n').map(l => l.split(' : ')[0]).find(x => LIB[x] && !A.items.some(o => o.ex === x) && !blockedByPain(x, rmap));
      if (alt) { TOOL_IMPL.updateWorkout({ action: 'replace', exercise_index: k + 1, new_exercise_key: alt }); changes.push(`${exName(it.ex).toLowerCase()} remplacé par ${exName(alt).toLowerCase()}`); }
      else if (A.items.length > 1) { TOOL_IMPL.updateWorkout({ action: 'remove', exercise_index: k + 1 }); changes.push(`${exName(it.ex).toLowerCase()} retiré`); }
    }
    return { changes };
  },
  finishWorkout: () => {
    const A = S.active; if (!A) throw new Error('Aucune séance en cours.');
    if (!A.items.some(it => it.rows.some(r => r.done))) throw new Error('Aucune série validée : rien à enregistrer. Propose plutôt d\'annuler.');
    const name = activeTitle(); finishSession(); return `Séance « ${name} » enregistrée.`;
  },
};
async function runCoachTool(name, argsJson) {
  let args = {}; try { args = typeof argsJson === 'string' ? (argsJson ? JSON.parse(argsJson) : {}) : (argsJson || {}); } catch (e) { return JSON.stringify({ error: 'Arguments illisibles.' }); }
  ['exercise_key', 'new_exercise_key'].forEach(f => { if (args[f]) args[f] = resolveKey(args[f]); });
  if (Array.isArray(args.exercises)) args.exercises.forEach(e => { if (e && e.exercise_key) e.exercise_key = resolveKey(e.exercise_key); });
  if (args.exercise_key && !LIB[args.exercise_key]) return JSON.stringify({ error: 'Exercice inconnu : ' + args.exercise_key + '. Utilise findAlternatives ou draftWorkout pour obtenir un identifiant.' });
  const fn = TOOL_IMPL[name]; if (!fn) return JSON.stringify({ error: 'Outil inconnu : ' + name });

/* ----- Écoute -----

/* ----- Enregistrement + transcription Whisper (serveur gratuit) ----- */
async function ensureMic() {

    VC.actx = VC.actx && VC.actx.state !== 'closed' ? VC.actx : new (window.AudioContext || window.webkitAudioContext)();
    if (VC.actx.state === 'suspended') await VC.actx.resume();

    const chunks = []; let spoke = false, lastLoud = Date.now(); const t0 = Date.now();
    proc.onaudioprocess = (e) => {

      const lvl = Math.sqrt(sum / (d.length / 8));
      const orb = $('#cp-orb'); if (orb) orb.style.setProperty('--lvl', Math.min(1, lvl * 6).toFixed(3));

  } catch (e) {

    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) kbdFallback("Accès au micro refusé. Autorise-le dans Réglages de l'iPhone (Coach Fonte ou Safari, Micro), ou dicte avec le clavier.");
    else kbdFallback("Impossible d'utiliser le micro ici. Dicte avec la touche micro du clavier.");

}
async function stopRecording(cancel) {

  setVState('thinking'); if (bubble) { bubble.text = 'Transcription…'; appendMsgEl(bubble); }

// Convertit l'audio en WAV mono 16 kHz (format accepté partout par Whisper)

let FR_VOICE = null;

  try {
    const vs = speechSynthesis.getVoices().filter(v => /^fr(-|_|$)/i.test(v.lang));
    FR_VOICE = vs.find(v => /premium|enhanced|amélioré|siri/i.test(v.name) && /fr-FR/i.test(v.lang)) || vs.find(v => /fr-FR/i.test(v.lang) && /thomas|amelie|amélie|audrey|aurelie|marie/i.test(v.name)) || vs.find(v => /fr-FR/i.test(v.lang)) || vs[0] || null;
  } catch (e) {}
}
if (window.speechSynthesis) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
function speak(text, done) {
  if (!voiceOn() || !window.speechSynthesis || !text) { done && done(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/(\d+),(\d+)/g, '$1 virgule $2'));
    u.lang = 'fr-FR'; if (FR_VOICE) u.voice = FR_VOICE; u.rate = 1.04; u.pitch = 1;
    let ended = false; const fin = () => { if (ended) return; ended = true; done && done(); };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + text.length * 90);
    setVState('speaking'); speechSynthesis.speak(u);
  } catch (e) { done && done(); }
}

    });

    <label class="field"><span>Code d'accès</span><input id="cs-code" type="password" placeholder="Ton code personnel" value="${esc(c.server.code)}" autocomplete="off" autocapitalize="off"></label>
    <div class="row wrap"><button class="btn sm" data-a="cs-save">Enregistrer</button><button class="btn sm ghost" data-a="cs-test">Tester</button></div><p class="muted small" id="cs-msg"></p>` : ''}
    <label class="field"><span>Écoute du micro</span><select id="cs-engine">${[['', 'Automatique (recommandé)'], ['rec', 'Enregistrement + transcription serveur'], ['sr', "Reconnaissance vocale de l'iPhone"], ['kbd', 'Dictée du clavier']].map(([v, l]) => `<option value="${v}" ${(c.engine || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <span class="lbl">Ce que le coach retient</span>
    <div class="tagsx">${memHtml || '<span class="muted small">Rien pour l\'instant.</span>'}</div>
    ${pains.length ? `<span class="lbl">Douleurs signalées</span>${pains.map(([k, p]) => `<div class="row between"><span>${esc(PAIN_AREAS[k].label)}${p.note ? ' · ' + esc(p.note) : ''}</span><button class="btn sm ghost" data-a="pain-ok" data-v="${k}">C'est passé</button></div>`).join('')}` : ''}
  </section>`;
}
async function coachTest() {
  const msg = $('#cs-msg'); const s = coachState().server;
  if (!s.url || !s.code) { msg.textContent = "Renseigne l'adresse et le code, puis enregistre."; return; }
  msg.textContent = 'Test…';
  try { BRAIN.aiDown = 0; const t = await callAI([{ role: 'system', content: 'Réponds uniquement {"say":"ok","actions":[]}' }, { role: 'user', content: 'test' }]); msg.textContent = t ? "L'IA gratuite répond. Le coach l'utilisera automatiquement." : 'Réponse vide du serveur.'; }
  catch (e) { msg.textContent = e && e.code === 'unauthorized' ? "Code d'accès refusé." : e && e.code === 'quota' ? 'Quota gratuit du jour épuisé.' : e && e.code === 'server_config' ? "Le Worker n'est pas relié à Workers AI (binding AI manquant)." : "Serveur injoignable. Vérifie l'adresse (elle commence par https://)."; }
}

/* ----- Événements ----- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'coach-fab') coachOpen(VC.panel === 'adapt' ? 'adapt' : 'voice');
  else if (a === 'coach-min') coachMinimize();
  else if (a === 'coach-close') coachClose();
  else if (a === 'coach-voice') { VC.mode = 'voice'; coachOpen('voice'); }
  else if (a === 'adapt-open') { stopListening(); try { speechSynthesis.cancel(); } catch (err) {} AD.minutes = null; coachOpen('adapt'); }
  else if (a === 'ad-set') adaptSet(b.dataset.g, b.dataset.v);
  else if (a === 'ad-go') adaptGo();
  else if (a === 'coach-mic') {
    VC.emptyRuns = 0;
    if (VC.recording) { stopRecording(false); return; }
    if (VC.state === 'listening') { const r = VC.rec; try { r && r.stop(); } catch (err) {} return; }
    if (VC.state === 'speaking') { try { speechSynthesis.cancel(); } catch (err) {} }
    if (VC.busy) return;
    VC.mode = 'voice'; const f = $('#cp-text'); if (f && micEngine() !== 'kbd') f.hidden = true; startListening();
  }
  else if (a === 'coach-text') { if (VC.mode === 'text') { VC.mode = 'voice'; $('#cp-text').hidden = true; setVState('idle'); } else enterTextMode(false); }
  else if (a === 'coach-voiceon') { const c = coachState(); c.voiceOn = !voiceOn(); if (!c.voiceOn) try { speechSynthesis.cancel(); } catch (err) {} persist(); renderVoicePanel(); }
  else if (a === 'cs-save') { const c = coachState(); c.server.url = ($('#cs-url').value || '').trim(); c.server.code = ($('#cs-code').value || '').trim(); BRAIN.aiDown = 0; persist(); $('#cs-msg').textContent = 'Enregistré.'; }
  else if (a === 'cs-test') coachTest();
  else if (a === 'mem-del') { const m = coachState().memory; m[b.dataset.l] = m[b.dataset.l].filter(x => x !== b.dataset.v); persist(); render(); }
  else if (a === 'pain-ok') { delete coachState().condition.pain[b.dataset.v]; persist(); render(); }
});
document.addEventListener('change', e => { if (e.target.id === 'cs-engine') { coachState().engine = e.target.value || null; VC.srBroken = false; persist(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'cp-text') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const i = $('#cp-input'); const v = i.value.trim(); i.value = ''; if (!v) return;
  addMsg('user', v); handleUser(v);
}, true);

/* ===== Démarrage (après chargement de tous les modules) ===== */
setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = fmtTime((Date.now() - S.active.startedAt) / 1000); }, 1000);
const IS_STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if (window.PWA && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded && !S.active) { reloaded = true; location.reload(); } });
}
render();
if (window.PWA) setTimeout(writeSwState, 1500);

</script>

</body>
